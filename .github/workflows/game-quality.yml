name: Game code quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check web/main.js
          node --check web/veggie-adventure.js
          node --check web/discovery-world.js
          node --check web/storybook-world.js
          node --check sw.js
      - name: Check required game elements and cache assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('web/veggie-adventure.js').read_text()
          styles=Path('web/styles.css').read_text()
          assert '.quest,.story,.companion,.welcome{display:none!important}' in styles, 'Retired sparkle quest UI must stay hidden'
          assert '#read,#restart{display:none!important}' in styles, 'Retired legacy controls must stay hidden'
          assert 'stopMovement();hero.position.set(-1.7,0,1)' in js, 'New adventure must start at the canonical hero spawn'
          cache=Path('sw.js').read_text()
          ids=['parent-setup','start-adventure','parent-settings','world','munch','victory','play-again','garden-journey','level-fill','joystick']
          import re
          for name in ids:
              assert f'id="{name}"' in html, f'Missing game UI: {name}'
          found=re.findall('id="([^"]+)"', html)
          duplicates=sorted({name for name in found if found.count(name)>1})
          assert not duplicates, f'Duplicate HTML ids: {duplicates}'
          assert 'tabindex="0"' in html and 'aria-describedby="play-status"' in html, 'Game canvas keyboard access missing'
          assert 'role="status"' in html and 'aria-live="polite"' in html, 'Live gameplay status missing'
          assert 'role="progressbar"' in html, 'Garden progress semantics missing'
          assert 'veggie-collected' in js and 'veggie-munched' in js, 'Vegetable interaction events missing'
          assert 'veggie-world-reset' in js and 'veggie-discoveries-reset' in js, 'Adventure reset lifecycle missing'
          assert 'completedGardens=level;' in js, 'Saved chapter and restored garden count must agree'
          assert 'Number.isFinite(Number(previous.found))' in js and 'Number.isFinite(Number(previous.eaten))' in js, 'Saved counters must reject invalid numbers'
          assert 'Number.isFinite(Number(previous.levelMunched))' in js, 'Saved garden progress must reject invalid values'
          assert '!chosenTypes.includes(v.userData.type)' in js, 'Unselected vegetables must not be collected'
          assert 'if(!chosenTypes.includes(type)){updateHud();saveAdventure();return}' in js, 'Munch must reject invalid basket entries'
          assert 'Number.isFinite(px)' in js and 'Number.isFinite(pz)' in js, 'Saved player position must reject invalid coordinates'
          assert 'Math.max(0,activeLevel().need-levelMunched)' in js, 'Remaining garden goal must not be negative'
          assert 'stopMovement();hero.position.set(-1.7,0,1);ensureGoalAvailable();saveAdventure()' in js, 'Garden transition must clear movement and ensure required veggies'
          assert 'if(Array.isArray(previous.bag)&&bag.length===0){munch.disabled=true}' in js, 'Empty saved basket must disable munch'
          main=Path('web/main.js').read_text()
          assert 'completedGardens=level;state.collected=' in js, 'Resume statistics must not be swallowed by a comment'
          assert "window.addEventListener('veggie-collected',()=>chime())" in main, 'Collect sound must be connected to vegetable play'
          assert "if(soundOn){chime()}" in main, 'Sound toggle must not narrate retired story'
          assert 'const sprigSmile=' in main and 'const sprigEyes=' in main, 'Sprig expressive face missing'
          assert 'sprigCheer=2.4' in main and 'sparkleBurst(sprig)' in main, 'Sprig garden-completion celebration missing'
          assert 'webglcontextlost' in main and 'webglcontextrestored' in main, 'WebGL recovery hooks missing'
          assert 'veggie-renderer-lost' in html and 'veggie-renderer-restored' in html, 'Renderer recovery UI missing'
          assert 'veggieverse-v8' in cache, 'Offline cache version not refreshed'
          assert "cache.add(ENGINE)" in cache and 'three@0.170.0' in cache, '3D engine offline prefetch missing'
          assert 'Promise.race([request' in cache and '2500' in cache, 'Slow-network offline fallback missing'
          assert 'id="parent-gate"' in html and 'id="parent-gate-hold"' in html, 'Parent adult gate markup missing'
          assert 'beginGateHold' in js and 'openParentSettings' in js and 'wasPlayingBeforeGate' in js, 'Parent gate interaction lifecycle missing'
          assert 'pointercancel' in js and 'keyup' in js, 'Parent gate cancellation/keyboard handling missing'
          assert "e.key==='Tab'" in js and 'document.activeElement' in js, 'Adult dialog focus containment missing'
          assert 'id="garden-celebration"' in html and 'announceGardenRepair' in js, 'Garden completion feedback missing'
          assert 'ensureGoalAvailable' in js and 'needed-available' in js, 'Vegetable softlock prevention missing'
          assert 'function stopMovement()' in js and 'keys.clear();target=null' in js, 'Parent pause must clear movement state'
          assert 'new THREE.RingGeometry(.3,.47,32)' in js and 'destinationMarker.visible=Boolean(target)' in js, 'Tap destination marker missing'
          assert 'v.visible&&chosenTypes.includes(v.userData.type)' in js, 'Tap targeting must respect selected vegetables'
          assert 'finished=true;started=false;stopMovement()' in js, 'Victory must clear movement state'
          assert 'stopMovement();hero.position.set(-1.7,0,1)' in js, 'New adventure must reset position and controls'
          assert "canvas.addEventListener('blur'" in js, 'Canvas focus loss must clear movement'
          assert 'keys.clear();release();target=new THREE.Vector3' in js, 'Tap movement must override held input'
          assert 'banner.dataset.garden=type.toLowerCase()' in js, 'Garden celebration theming missing'
          assert "$('#victory-title').focus" in js, 'Victory keyboard focus missing'
          assert 'e.target===canvas' in js and "e.code==='Space'" in js, 'Canvas-focused keyboard controls missing'
          assert "--hold-progress" in js and "--hold-progress" in Path('web/styles.css').read_text(), 'Adult hold visual feedback missing'
          assert "veggieverse-v8" in cache and 'if(!response.ok' in cache, 'Service worker must fall back to a healthy cached version'
          world=Path('web/discovery-world.js').read_text()
          assert 'const restorationFireflies=[]' in world and 'restorationCenters=' in world, 'Restoration firefly world effect missing'
          assert 'const fireflyGeometry=new THREE.SphereGeometry' in world, 'Firefly geometry must be shared'
          assert 'const gardenMarkers=[]' in world, 'Garden landmarks must remain recognizable'
          assert 'for(const particle of particles)scene.remove(particle.mesh)' in world, 'Reset must remove leftover celebration particles'
          assert 'theme.petal.clone()' in world, 'Crown glow must not mutate shared scenery materials'
          assert "landmark.crown.material.emissive.set('#283b20')" in world, 'Restored landmark glow must activate immediately'
          assert 'bloom.rotation.y=reduced?0:' in world, 'Reduced motion must stop bloom rotation'
          assert 'gardenGlowMats' in world and 'fly.mesh.material=gardenGlowMats' in world, 'Garden-specific firefly materials missing'
          assert "const finalBanner=$('#garden-celebration')" in js, 'Victory must hide celebration overlay'
          assert 'party:[0,-5]' in world, 'Pea Party effects must match the actual party location'
          assert 'const gardenHalos={}' in world and 'halo.visible=explorationEnabled&&progress>.02' in world, 'Garden progress halos missing'
          assert "stopMovement();setup.querySelector('input[type=checkbox]')" in js, 'Adult hold unlock must clear movement'
          assert 'fly.mesh.visible=explorationEnabled&&amount>.05' in world, 'Fireflies must respect paused gameplay'
          assert 'restoration.progress=0;for(const fly of restorationFireflies)' in world, 'New adventure must reset world restoration'
          assert 'const droplets=[]' in world and 'fountainAmount' in world, 'Fountain repair animation missing'
          assert 'const partyLights=[]' in world and 'partyAmount' in world, 'Party lighting animation missing'
          assert 'baseY:balloon.position.y' in world and 'prop.mesh.position.y=prop.baseY' in world, 'Party balloons must animate from a fixed base height'
          assert 'prop.base-.85' in world, 'Bridge rail repair animation missing'
          for name in ('Carrot','Broccoli','Tomato','Pea'):
              assert name in js, f'Missing veggie type: {name}'
          for path in ('web/main.js','web/veggie-adventure.js','web/discovery-world.js','web/storybook-world.js'):
              assert Path(path).exists(), f'Missing module: {path}'
              assert f"'./{path}'" in cache, f'Missing offline cache entry: {path}'
          print('Static game integrity checks passed')
          PY
