name: Deploy web game to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript module syntax
        run: |
          node --check web/main.js
          node --check web/storybook-world.js
          node --check web/veggie-adventure.js
          node --check web/discovery-world.js
          node --check sw.js
          node --check tests/site-smoke.cjs
      - name: Run game entry and asset smoke checks
        run: node tests/site-smoke.cjs
      - name: Check web entry points
        run: |
          test -s index.html
          test -s web/styles.css
          test -s web/main.js
          test -s web/storybook-world.js
          test -s web/veggie-adventure.js
          test -s web/discovery-world.js
          test -s manifest.webmanifest
          test -s web/brand/app-icon-192.png
          test -s web/brand/apple-touch-icon.png
          test -s web/brand/eat-your-veggies-app-icon.png
          test -s web/brand/favicon.png
          test -s web/brand/header.webp
          test -s web/brand/mascot.webp
          test -s web/brand/title.webp
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
